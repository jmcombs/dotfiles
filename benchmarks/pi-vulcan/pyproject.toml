[project]
name = "pi-vulcan"
version = "0.1.0"
description = "Headless pi runner for a VulcanBench task subset."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

[project.scripts]
pi-vulcan = "pi_vulcan.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["tasks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: requires a running llama.cpp router and pi",
]
